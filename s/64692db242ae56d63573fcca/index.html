const KEY='realm-sent-2026-10-31';let sent={};try{sent=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(sent))}catch(e){}}
function copy(t,b){const done=()=>{const o=b.textContent;b.textContent='Copied';b.classList.add('copied');setTimeout(()=>{b.textContent=o;b.classList.remove('copied')},1500)};
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,()=>fb(t,done));else fb(t,done)}
function fb(t,done){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
// Each tick goes to his private relay topic; sync-sent.mjs on the VPS writes it into the Sheet.
// 2026-10-23: ticks were lost when the one POST failed (phone switched to Messenger, weak signal): Homer Tree Care
// and A Old Time Roofing came back as unsent. Now every tick waits in an outbox (localStorage) with the tap time
// and is retried on load, on return to the tab, when back online and every 15 s, until the relay says OK.
const OB='realm-outbox';function ob(){try{return JSON.parse(localStorage.getItem(OB)||'[]')}catch(e){return[]}}
function obSave(q){try{localStorage.setItem(OB,JSON.stringify(q))}catch(e){}}
let flushing=false;async function flush(){if(flushing)return;flushing=true;try{let q=ob();while(q.length){const ev=q[0];
 const r=await fetch('https://ntfy.sh/'+D.sentTopic,{method:'POST',body:JSON.stringify(ev),keepalive:true}).catch(()=>null);
 if(!r||!r.ok)break;q=ob();q.shift();obSave(q)}}finally{flushing=false;const n=ob().length;const b=document.getElementById('obs');if(b)b.textContent=n?n+' tick(s) not saved yet, retrying…':''}}

 const r=el('div','row');const a=el('a','btn primary','Copy + open chat');a.href=l.messenger;a.target='_blank';a.rel='noopener';a.onclick=()=>copy(text,a);

 r.append(a,p,s);c.append(r);
 const rep=el('button','secondary',sent[k+'r']?'Marked: replied':'They replied');rep.onclick=()=>{sent[k+'r']=1;save();rep.textContent='Marked: replied';c.classList.add('done');post({id:l.id,kind:'replied'})};
 const r2=el('div','row');r2.append(rep);c.append(r2);
 if(l.preview){const d=el('details');d.append(el('summary',null,'If they say yes: the preview link'),el('div','msg',l.preview));const b=el('button','secondary','Copy link');b.onclick=()=>copy(l.preview,b);d.append(b);c.append(d)}return c}
