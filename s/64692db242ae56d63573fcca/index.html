const KEY='realm-sent-2026-11-09';let sent={};try{sent=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(sent))}catch(e){}}
const DESK=!/iPhone|iPad|Android/i.test(navigator.userAgent);
function copy(t,b){const done=()=>{const o=b.textContent;b.textContent='Copied';b.classList.add('copied');setTimeout(()=>{b.textContent=o;b.classList.remove('copied')},1500)};
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,()=>fb(t,done));else fb(t,done)}
function fb(t,done){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
// Each tick goes to his private relay topic; sync-sent.mjs on the VPS writes it into the Sheet.
// 2026-10-23: ticks were lost when the one POST failed (phone switched to Messenger, weak signal): Homer Tree Care
// and A Old Time Roofing came back as unsent. Now every tick waits in an outbox (localStorage) with the tap time
// and is retried on load, on return to the tab, when back online and every 15 s, until the relay says OK.
const OB='realm-outbox';function ob(){try{return JSON.parse(localStorage.getItem(OB)||'[]')}catch(e){return[]}}
function obSave(q){try{localStorage.setItem(OB,JSON.stringify(q))}catch(e){}}
let flushing=false;async function flush(){if(flushing)return;flushing=true;try{let q=ob();while(q.length){const ev=q[0];
 const r=await fetch('https://ntfy.sh/'+D.sentTopic,{method:'POST',body:JSON.stringify(ev),keepalive:true}).catch(()=>null);
 if(!r||!r.ok)break;q=ob();q.shift();obSave(q)}}finally{flushing=false;const n=ob().length;const b=document.getElementById('obs');if(b)b.textContent=n?n+' tick(s) not saved yet, retrying…':''}}
function post(ev){ev.at=Date.now();const q=ob();q.push(ev);obSave(q);return flush()}
addEventListener('visibilitychange',()=>{if(!document.hidden)flush()});addEventListener('online',flush);setInterval(flush,15000);setTimeout(flush,500);
function card(l,k,text,label,kind){const c=el('section','card'+(sent[k]?' done':''));const top=el('div','top');const L=el('div');L.append(el('div','tag',label),el('div','name',l.name));
 top.append(L,el('div','meta',[l.city,l.phone].filter(Boolean).join(' · ')));c.append(top,el('div','msg',text));

 // the same message sent fine from their Page's Message button. So Facebook leads open their Page (Facebook app on the

 // 2026-11-08 (Aayan): back to opening the chat directly. Opening their Page failed for most leads (no Message

 if(l.search&&!DESK)c.append(el('div','meta','No direct chat link: the button opens Messenger. Search "'+l.name+'" there and paste.'));
 else if(!l.ig)c.append(el('div','meta','If the chat says "Facebook User" at the top, don’t send there: use the Facebook page button and tap Message.'));
 const r=el('div','row');const a=el('a','btn primary','Copy + open chat');a.href=href;if(/^https?:/.test(href)){a.target='_blank';a.rel='noopener'}a.onclick=()=>copy(text,a);
 // 2026-11-09: first DMs from the iPhone Messenger app fail ("Couldn’t send") while the same DM sends fine from
 // facebook.com on his PC. So on a phone, Facebook leads get no send button, just a pointer to the PC.
 if(!DESK&&!l.ig){a.textContent='Send this one from your PC';a.removeAttribute('href');a.onclick=null;a.className='btn secondary';a.style.pointerEvents='none'}
 if(l.image){const im=document.createElement('img');im.src=l.image;im.alt='Screenshot to attach';im.style.cssText='width:100%;border-radius:8px;border:1px solid var(--line)';c.append(el('div','meta','Long-press the screenshot to save it, then attach it to the message.'),im)}
 const p=el('a','btn secondary',l.ig?'Instagram':'Facebook page');p.href=(!DESK&&l.page)?l.page:l.fb;if(/^https?:/.test(p.href)){p.target='_blank';p.rel='noopener'}
 const s=el('label','sent');const x=document.createElement('input');x.type='checkbox';x.checked=!!sent[k];x.onchange=()=>{sent[k]=x.checked;save();c.classList.toggle('done',x.checked);post({id:l.id,kind:kind,undo:!x.checked})};s.append(x,document.createTextNode('Sent'));
 r.append(a,p,s);c.append(r);
 const rep=el('button','secondary',sent[k+'r']?'Marked: replied':'They replied');rep.onclick=()=>{sent[k+'r']=1;save();rep.textContent='Marked: replied';c.classList.add('done');post({id:l.id,kind:'replied'})};
 const r2=el('div','row');r2.append(rep);c.append(r2);

if(!DESK){const n=el('p','sub','On a phone? Open this same link on your PC to send. Facebook messages from the iPhone app fail, from facebook.com on the PC they go through.');n.style.cssText='color:#e5484d;font-weight:700';document.querySelector('header').append(n)}
