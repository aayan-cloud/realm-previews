 if(!r||!r.ok)break;q=ob();q.shift();obSave(q)}}finally{flushing=false;const n=ob().length;const b=document.getElementById('obs');if(b)b.textContent=n?n+' tick(s) not saved yet, retrying…':''}}
function post(ev){ev.at=Date.now();const q=ob();q.push(ev);obSave(q);return flush()}
addEventListener('visibilitychange',()=>{if(!document.hidden)flush()});addEventListener('online',flush);setInterval(flush,15000);setTimeout(flush,500);
function card(l,k,text,label,kind){const c=el('section','card'+(sent[k]?' done':''));const top=el('div','top');const L=el('div');L.append(el('div','tag',label),el('div','name',l.name));
 top.append(L,el('div','meta',[l.city,l.phone].filter(Boolean).join(' · ')));c.append(top,el('div','msg',text));if(l.search)c.append(el('div','meta','No direct chat link: the button opens Messenger. Search "'+l.name+'" there and paste.'));
 const r=el('div','row');const a=el('a','btn primary','Copy + open chat');a.href=l.messenger;if(/^https?:/.test(l.messenger)){a.target='_blank';a.rel='noopener'}a.onclick=()=>copy(text,a);
 if(l.image){const im=document.createElement('img');im.src=l.image;im.alt='Screenshot to attach';im.style.cssText='width:100%;border-radius:8px;border:1px solid var(--line)';c.append(el('div','meta','Long-press the screenshot to save it, then attach it to the message.'),im)}
 const p=el('a','btn secondary',l.ig?'Instagram':'Facebook page');p.href=l.fb;p.target='_blank';p.rel='noopener';
 const s=el('label','sent');const x=document.createElement('input');x.type='checkbox';x.checked=!!sent[k];x.onchange=()=>{sent[k]=x.checked;save();c.classList.toggle('done',x.checked);post({id:l.id,kind:kind,undo:!x.checked})};s.append(x,document.createTextNode('Sent'));
 r.append(a,p,s);c.append(r);
 const rep=el('button','secondary',sent[k+'r']?'Marked: replied':'They replied');rep.onclick=()=>{sent[k+'r']=1;save();rep.textContent='Marked: replied';c.classList.add('done');post({id:l.id,kind:'replied'})};
 const r2=el('div','row');r2.append(rep);c.append(r2);
 if(l.preview){const d=el('details');d.append(el('summary',null,'If they say yes: the preview link'),el('div','msg',l.preview));const b=el('button','secondary','Copy link');b.onclick=()=>copy(l.preview,b);d.append(b);c.append(d)}return c}
const A=document.getElementById('agency');if((D.agency||[]).length){A.append(el('h2',null,'Agency DMs (Instagram)'),el('p','sub','These go out on Instagram, not your Facebook profile, so they are outside the daily cap.'));D.agency.forEach(l=>A.append(card(l,(l.kind==='first'?'n':l.kind)+l.id,l.text,'Agency · '+l.which,l.kind)))}
const F=document.getElementById('fresh');if(!D.fresh.length)F.append(el('p','sub','No new first messages today.'));D.fresh.forEach((l,i)=>F.append(card(l,'n'+l.id,l.dm,(i+1)+' · '+l.offer,'first')));
const U=document.getElementById('due');if(D.due.length){U.append(el('h2',null,'Follow-ups due (you sent the first message, no reply yet)'));D.due.forEach((l,i)=>U.append(card(l,l.kind+l.id,l.text,l.which,l.kind)))}
})();
