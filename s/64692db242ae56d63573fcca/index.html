.primary{background:var(--btn);color:var(--btnink)}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
.sent{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}.copied{background:var(--ok)!important;color:#fff!important}

function save(){try{localStorage.setItem(KEY,JSON.stringify(sent))}catch(e){}}
function copy(t,b){const done=()=>{const o=b.textContent;b.textContent='Copied';b.classList.add('copied');setTimeout(()=>{b.textContent=o;b.classList.remove('copied')},1500)};
